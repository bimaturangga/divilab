name: divilab
description: "DiViLab – aplikasi pemantauan kesehatan (technical test Flutter)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  provider: ^6.1.2
  # Database lokal (SQLite)
  sqflite: ^2.4.1
  path: ^1.9.0
  # HTTP untuk API eksternal (dummyjson) & asisten AI
  http: ^1.2.2
  # Sesi & preferensi
  shared_preferences: ^2.3.3
  # Hash password (SHA-256 + salt)
  crypto: ^3.0.6
  # Font Plus Jakarta Sans (sesuai design system)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
