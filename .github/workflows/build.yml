name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Test & build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --org com.divilab --project-name divilab --platforms=android,ios
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: divilab-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Build iOS Simulator (tanpa codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --org com.divilab --project-name divilab --platforms=android,ios
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
      - run: cd build/ios/iphonesimulator && zip -r ../../../Runner-simulator.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: divilab-ios-simulator
          path: Runner-simulator.zip
